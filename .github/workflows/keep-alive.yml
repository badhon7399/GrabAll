name: Keep Server Alive

on:
  schedule:
    # Run every 5 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: '*/5 * * * *'
  workflow_dispatch: # Enable running manually via GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: |
          echo "Pinging backend health check at $(date)"
          curl -f -s https://graball-1.onrender.com/api/health || echo "Ping failed or server is sleeping, waking it up..."
